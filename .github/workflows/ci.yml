name: ci
on:
  push:
  pull_request:
jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: fpl-team-analysis/package.json
      - run: npm install --no-audit --no-fund
        working-directory: fpl-team-analysis
      - run: npm run typecheck
        working-directory: fpl-team-analysis
